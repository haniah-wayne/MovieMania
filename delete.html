<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMania | Delete Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="banner">
            <h1>MovieMania</h1>
            <p>The best site for reviewing movies</p>
        </div>
        <nav class="navbar">
            <a href="index.html">Main Page</a>
            <a href="entry.html">Data Entry</a>
            <a href="delete.html" class="active">Delete Data</a>
            <a href="update.html">Update Data</a>
            <a href="summary.html">Summary</a>
            <a href="documentation.html">Documentation</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="panel">
            <div class="panel-header">
                <h2>Delete <em>Data</em></h2>
                <p class="section-subtitle">Search for entries to remove</p>
            </div>
            <div class="panel-body">
                <form class="form-grid" id="deleteSearchForm">
                    <div class="form-group">
                        <label for="delete-user">Reviewer Name <span class="req">*</span></label>
                        <input type="text" id="delete-user" name="delete-user" placeholder="Enter numeric user ID">
                    </div>
                    <div class="form-group">
                        <label for="delete-movie">Movie Title <span class="opt">(optional)</span></label>
                        <input type="text" id="delete-movie" name="delete-movie" placeholder="Enter exact movie title">
                    </div>
                    <div class="button-row">
                        <button type="submit" class="btn btn-primary">Search</button>
                        <button type="reset" class="btn btn-ghost">Clear</button>
                    </div>
                </form>

                <section class="results-section">
                    <h3>Matching Reviews</h3>
                    <div class="result-list" id="deleteResults"></div>
                </section>

                <div class="note" id="deleteMessage">
                    Search by numeric user ID. Add a movie title if you want one exact match. This action cannot be undone!!
                </div>
            </div>
        </section>
    </main>

    <footer>
        <span>MovieMania</span>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
