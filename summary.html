<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMania | Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="banner">
            <h1>MovieMania</h1>
            <p>The best site for reviewing movies</p>
        </div>
        <nav class="navbar">
            <a href="index.html">Main Page</a>
            <a href="entry.html">Data Entry</a>
            <a href="delete.html">Delete Data</a>
            <a href="update.html">Update Data</a>
            <a href="summary.html" class="active">Summary</a>
            <a href="documentation.html">Documentation</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="panel">
            <div class="panel-header">
                <h2>Database <em>Summary</em></h2>
                <p class="section-subtitle">Shows overall stats</p>
            </div>
            <div class="panel-body">

                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-num" id="totalReviews">—</div>
                        <div class="stat-label">Total Reviews</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="uniqueMovies">—</div>
                        <div class="stat-label">Unique Movies</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="avgRating">—</div>
                        <div class="stat-label">Avg. Rating</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="reviewerCount">—</div>
                        <div class="stat-label">Reviewers</div>
                    </div>
                </div>

                <hr class="rule">

                <div class="empty-space" id="summaryData"></div>

            </div>
        </section>
    </main>

    <footer>
        <span>MovieMania</span>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
